services:
  backend:
    build: { context: ., dockerfile: Dockerfile.backend }
    env_file: [.env]          # copy .env.example to .env first
    volumes: ["./data:/app/data"]   # SQLite DB + FAISS index persist on the host
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 5
  frontend:
    build: { context: ., dockerfile: Dockerfile.frontend }
    environment: [BACKEND_URL=http://backend:8000]
    ports: ["8501:8501"]
    depends_on: { backend: { condition: service_healthy } }
